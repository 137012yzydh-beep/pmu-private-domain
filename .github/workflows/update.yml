name: 每日更新训练报告

on:
  schedule:
    # 北京时间每天早上 7:00 (UTC 23:00)
    - cron: "0 23 * * *"
  workflow_dispatch:  # 允许手动触发

# 权限：允许 Actions 推送回 repo，允许 Pages 部署
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 拉取训记数据并生成报告
        env:
          XUNJI_API_KEY: ${{ secrets.XUNJI_API_KEY }}
        run: python ci_fetch.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add train_report.html
          git diff --staged --quiet || git commit -m "auto: 更新训练报告 $(date +%Y-%m-%d)"
          git push
          
      - name: 创建首页入口
        run: cp train_report.html index.html

      - name: 设置 Pages
        uses: actions/configure-pages@v4

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
